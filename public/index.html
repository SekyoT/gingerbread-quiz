<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>What Christmas Gift Are You? · The Well Project</title>
  <meta name="description" content="A Christmas personality quiz from The Well Project: find out which gift you bring to the group, and meet your team." />
  <link rel="icon" type="image/png" href="/well-hello-logo.png" />
  <link rel="apple-touch-icon" href="/well-hello-logo.png" />
  <meta name="theme-color" content="#0e3b2c" />
  <!-- Link preview when the quiz is shared on Telegram / WhatsApp / Instagram -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="The Well Project" />
  <meta property="og:title" content="What Christmas Gift Are You? 🎁 The Well Project" />
  <meta property="og:description" content="Take our Christmas personality quiz, find your gift and meet your team for the night!" />
  <meta property="og:image" content="https://gift-personality.vercel.app/well-hello-logo.png" />
  <meta property="og:url" content="https://gift-personality.vercel.app/" />
  <meta name="twitter:card" content="summary" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --pine: #0e3b2c;
      --pine-2: #15553f;
      --cream: #fff8ec;
      --ink: #3a2212;
      --muted: #7a5a43;
      --red: #c8283a;
      --gold: #f2c14e;
      --accent: var(--red);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    html { background: var(--pine); }
    body {
      font-family: "Nunito", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse at top, #1f6b4f 0%, transparent 60%),
        linear-gradient(180deg, var(--pine-2), var(--pine));
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 48px;
      overflow-x: hidden;
    }

    /* ---------- snow ---------- */
    #snow { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .flake {
      position: absolute; top: -10px; color: #fff; opacity: .8; user-select: none;
      animation: fall linear infinite;
    }
    @keyframes fall {
      to { transform: translateY(110vh) translateX(var(--drift)); }
    }
    @media (prefers-reduced-motion: reduce) { #snow { display: none; } }

    /* ---------- layout ---------- */
    /* ---------- The Well Project header ---------- */
    .brand {
      position: relative; z-index: 1; display: flex; align-items: center; gap: 14px;
      margin: 4px 0 14px; color: #fff; text-align: left;
    }
    .logo-wrap { position: relative; flex: none; width: 76px; height: 76px; }
    .logo-wrap img {
      width: 100%; height: 100%; display: block; border-radius: 20px;
      box-shadow: 0 0 0 4px #fff, 0 0 0 7px var(--gold), 0 10px 24px rgba(0,0,0,.35);
    }
    .logo-wrap .holly { position: absolute; width: 58px; left: -22px; top: -22px; transform: rotate(-18deg); filter: drop-shadow(0 2px 3px rgba(0,0,0,.3)); }
    .logo-wrap .twinkle { position: absolute; color: var(--gold); font-size: 16px; animation: twinkle 1.8s ease-in-out infinite; }
    .logo-wrap .t1 { right: -14px; top: -10px; }
    .logo-wrap .t2 { right: -18px; bottom: 4px; font-size: 11px; animation-delay: .6s; }
    .logo-wrap .t3 { left: -12px; bottom: -8px; font-size: 12px; animation-delay: 1.2s; }
    @keyframes twinkle { 50% { opacity: .25; transform: scale(.7) rotate(20deg); } }
    .brand-text .presents { font-size: .78rem; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: var(--gold); }
    .brand-text .name { font-family: "Mountains of Christmas", cursive; font-weight: 700; font-size: 2rem; line-height: 1; margin: 2px 0; }
    .brand-text .event { font-size: .9rem; color: #d9efe4; font-weight: 600; }
    @media (prefers-reduced-motion: reduce) { .logo-wrap .twinkle { animation: none; } }

    .bunting {
      position: relative; z-index: 1; display: flex; gap: 6px; margin-bottom: 14px;
    }
    .bunting span {
      width: 22px; height: 26px; clip-path: polygon(0 0, 100% 0, 50% 100%);
    }
    .bunting span:nth-child(3n+1) { background: var(--red); }
    .bunting span:nth-child(3n+2) { background: var(--gold); }
    .bunting span:nth-child(3n) { background: #fff; }

    .card {
      position: relative; z-index: 1;
      width: 100%; max-width: 560px;
      background: var(--cream);
      border-radius: 28px;
      padding: 32px 28px;
      box-shadow: 0 20px 50px rgba(0,0,0,.35), inset 0 0 0 6px #fff, inset 0 0 0 9px #e9d6bd;
    }
    .card::before {
      /* icing drips along the top */
      content: ""; position: absolute; left: 18px; right: 18px; top: -1px; height: 18px;
      background:
        radial-gradient(circle at 10px 0, #fff 10px, transparent 11px) 0 0 / 40px 18px repeat-x;
      opacity: .9; pointer-events: none;
    }
    .screen { display: none; animation: pop .35s ease; }
    .screen.active { display: block; }
    @keyframes pop { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

    h1, h2 { font-family: "Mountains of Christmas", cursive; margin: 0; line-height: 1.05; }
    h1 { font-size: clamp(2.4rem, 9vw, 3.3rem); color: var(--red); text-align: center; }
    h2 { font-size: clamp(1.7rem, 6.5vw, 2.2rem); }
    p { line-height: 1.55; }
    .center { text-align: center; }
    .muted { color: var(--muted); }

    .hero-cookies { display: flex; justify-content: center; gap: 6px; margin: 6px 0 8px; }
    .hero-cookies svg { width: 78px; height: auto; animation: bob 2.6s ease-in-out infinite; }
    .hero-cookies svg:nth-child(2) { animation-delay: .3s; }
    .hero-cookies svg:nth-child(3) { animation-delay: .6s; }
    .hero-cookies svg:nth-child(4) { animation-delay: .9s; }
    .hero-cookies svg:nth-child(5) { animation-delay: 1.2s; }
    @keyframes bob { 50% { transform: translateY(-6px) rotate(-3deg); } }

    label { font-weight: 800; display: block; margin: 22px 0 8px; }
    input[type="text"] {
      width: 100%; font: inherit; font-size: 1.1rem;
      padding: 14px 16px; border-radius: 14px;
      border: 2px solid #e4cdb0; background: #fff; color: var(--ink);
    }
    input[type="text"]:focus { outline: none; border-color: var(--red); box-shadow: 0 0 0 4px #c8283a22; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; margin-top: 18px; padding: 15px 20px;
      font: inherit; font-weight: 800; font-size: 1.1rem;
      color: #fff; background: var(--red);
      border: none; border-radius: 16px; cursor: pointer;
      box-shadow: 0 5px 0 #8f1a28;
      transition: transform .08s, box-shadow .08s, opacity .2s;
    }
    .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #8f1a28; }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .link {
      background: none; border: none; color: var(--muted); font: inherit; font-weight: 600;
      text-decoration: underline; cursor: pointer; padding: 6px;
    }
    .error { color: var(--red); font-weight: 600; min-height: 1.4em; margin: 8px 0 0; }

    /* ---------- questions ---------- */
    .progress-row { display: flex; justify-content: space-between; align-items: center; font-weight: 800; color: var(--muted); font-size: .95rem; }
    .progress {
      height: 14px; border-radius: 99px; margin: 10px 0 22px; overflow: hidden;
      background: #f0e2cf;
    }
    .progress > div {
      height: 100%; width: 0; border-radius: 99px; transition: width .35s ease;
      background: repeating-linear-gradient(-45deg, var(--red) 0 10px, #fff 10px 20px);
    }
    .question { font-size: clamp(1.25rem, 5vw, 1.45rem); font-weight: 800; margin: 0 0 18px; line-height: 1.35; }
    .answers { display: grid; gap: 10px; }
    .answer {
      text-align: left; font: inherit; font-size: 1.02rem; font-weight: 600; color: var(--ink);
      padding: 14px 16px; border-radius: 16px; cursor: pointer;
      background: #fff; border: 2px solid #ead6bb;
      transition: border-color .15s, background .15s, transform .1s;
    }
    .answer:hover { border-color: var(--red); }
    .answer:active { transform: scale(.98); }
    .answer.chosen { border-color: var(--red); background: #fdeaea; }

    /* ---------- loading ---------- */
    .oven { width: 130px; margin: 10px auto 0; animation: wobble .6s ease-in-out infinite; }
    @keyframes wobble { 25% { transform: rotate(-7deg); } 75% { transform: rotate(7deg) scale(1.04); } }

    /* ---------- result ---------- */
    .result-top { text-align: center; }
    .eyebrow { text-transform: uppercase; letter-spacing: .14em; font-weight: 800; font-size: .8rem; color: var(--muted); }
    .result-cookie { width: 180px; margin: 6px auto 0; filter: drop-shadow(0 10px 12px rgba(0,0,0,.18)); animation: pop-in .6s cubic-bezier(.2,1.6,.4,1) both, bob 2.6s ease-in-out .6s infinite; }
    @keyframes pop-in { from { transform: scale(.4) rotate(-10deg); opacity: 0; } }
    .result-name { color: var(--accent); margin-top: 6px; font-size: clamp(2.2rem, 9vw, 2.8rem); }
    .result-title { font-weight: 800; text-transform: uppercase; letter-spacing: .12em; font-size: .9rem; color: var(--muted); margin-top: 2px; }
    .tagline { font-weight: 800; font-style: italic; font-size: 1.1rem; margin: 12px 0 0; }
    .info { display: grid; gap: 10px; margin: 4px 0 0; }
    .info-row { background: #fff; border-radius: 16px; padding: 12px 14px; border: 2px solid #ead6bb; }
    .info-row .k { font-weight: 800; color: var(--accent); font-size: .85rem; text-transform: uppercase; letter-spacing: .08em; }
    .info-row .v { margin-top: 2px; font-weight: 600; }
    .traits { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 16px 0; }
    .trait { padding: 6px 12px; border-radius: 99px; font-weight: 800; font-size: .9rem; color: #fff; background: var(--accent); }
    .team-box {
      margin-top: 18px; padding: 18px; border-radius: 20px; text-align: center;
      border: 3px dashed var(--accent); background: #fff;
    }
    .team-box .team { font-family: "Mountains of Christmas", cursive; font-size: 2rem; color: var(--accent); margin: 2px 0; }
    .save-note { font-size: .9rem; color: var(--red); font-weight: 600; text-align: center; }

    footer { position: relative; z-index: 1; margin-top: 18px; color: #d9efe4; font-size: .85rem; opacity: .8; text-align: center; }
  </style>
</head>
<body>
  <div id="snow" aria-hidden="true"></div>

  <header class="brand">
    <div class="logo-wrap">
      <img src="/well-hello-logo.png" alt="The Well Project logo" width="76" height="76" />
      <svg class="holly" viewBox="0 0 120 80" aria-hidden="true">
          <path d="M60 46 C46 30 26 28 8 34 C18 38 20 46 16 54 C26 50 34 54 38 62 C42 52 52 50 60 46 Z" fill="#1f7a45"/>
          <path d="M60 46 C74 30 94 28 112 34 C102 38 100 46 104 54 C94 50 86 54 82 62 C78 52 68 50 60 46 Z" fill="#2a9254"/>
          <path d="M12 38 Q36 40 58 46 M108 38 Q84 40 62 46" stroke="#155c33" stroke-width="2" fill="none"/>
          <circle cx="52" cy="50" r="8" fill="#d42a3a"/><circle cx="68" cy="50" r="8" fill="#c8283a"/><circle cx="60" cy="40" r="8" fill="#e23b4a"/>
          <circle cx="57" cy="37" r="2.5" fill="#fff" opacity=".7"/><circle cx="49" cy="47" r="2.2" fill="#fff" opacity=".6"/><circle cx="65" cy="47" r="2.2" fill="#fff" opacity=".6"/>
        </svg>
      <span class="twinkle t1" aria-hidden="true">✦</span>
      <span class="twinkle t2" aria-hidden="true">✦</span>
      <span class="twinkle t3" aria-hidden="true">✦</span>
    </div>
    <div class="brand-text">
      <div class="presents">You're invited by</div>
      <div class="name">The Well Project</div>
      <div class="event">🎄 Christmas Mixer · Gift Quiz</div>
    </div>
  </header>

  <div class="bunting" aria-hidden="true">
    <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
  </div>

  <main class="card">
    <!-- Intro -->
    <section id="intro" class="screen active">
      <div class="hero-cookies" id="heroCookies" aria-hidden="true"></div>
      <h1 id="title">What Christmas Gift Are You?</h1>
      <p class="center muted" id="subtitle"></p>
      <form id="startForm" novalidate>
        <label for="name">What's your name?</label>
        <input id="name" type="text" maxlength="40" autocomplete="given-name" placeholder="e.g. Alex Tan" />
        <p class="error" id="nameError" role="alert"></p>
        <button class="btn" type="submit">Start the quiz 🎄</button>
      </form>
    </section>

    <!-- Question -->
    <section id="quiz" class="screen" aria-live="polite">
      <div class="progress-row">
        <button class="link" id="backBtn" type="button">← Back</button>
        <span id="progressText"></span>
      </div>
      <div class="progress"><div id="progressBar"></div></div>
      <p class="question" id="questionText"></p>
      <div class="answers" id="answers"></div>
    </section>

    <!-- Loading -->
    <section id="loading" class="screen center">
      <div class="oven" id="ovenCookie" aria-hidden="true"></div>
      <h2 style="margin-top:12px">Wrapping your gift…</h2>
      <p class="muted">Tying the bow ✨</p>
    </section>

    <!-- Result -->
    <section id="result" class="screen">
      <div class="result-top">
        <div class="eyebrow" id="resultHello"></div>
        <div class="result-cookie" id="resultCookie"></div>
        <h2 class="result-name" id="resultName"></h2>
        <div class="result-title" id="resultTitle"></div>
        <p class="tagline" id="resultTagline"></p>
      </div>
      <div class="traits" id="resultTraits"></div>
      <div class="info">
        <div class="info-row"><div class="k">🎁 Your gift</div><div class="v" id="resultGift"></div></div>
        <div class="info-row"><div class="k">✨ Ideal vibe</div><div class="v" id="resultVibe"></div></div>
      </div>
      <div class="team-box">
        <div class="eyebrow">You're on</div>
        <div class="team" id="resultTeam"></div>
        <div class="muted">Find your teammates and say hi! 👋</div>
      </div>
      <p class="save-note" id="saveNote" hidden></p>
      <p class="center"><button class="link" id="retakeBtn" type="button">Not you? Take the quiz again</button></p>
    </section>
  </main>

  <footer>Merry Christmas from The Well Project 🎁</footer>

  <script src="quiz-config.js"></script>
  <script src="gifts.js"></script>
  <script>
    const QUIZ = window.QUIZ;
    const STORAGE_KEY = "gift-quiz-result";
    const byId = (id) => document.getElementById(id);
    const personalityById = Object.fromEntries(QUIZ.personalities.map((p) => [p.id, p]));

    let playerName = "";
    let current = 0;
    let picks = [];        // index of the chosen answer for each question
    let shuffled = [];     // shuffled answer order for each question

    // ---------- snow ----------
    (function makeSnow() {
      const snow = byId("snow");
      const n = window.innerWidth < 600 ? 28 : 50;
      for (let i = 0; i < n; i++) {
        const f = document.createElement("div");
        f.className = "flake";
        f.textContent = Math.random() < 0.3 ? "❄" : "•";
        f.style.left = Math.random() * 100 + "vw";
        f.style.fontSize = 8 + Math.random() * 14 + "px";
        f.style.animationDuration = 7 + Math.random() * 10 + "s";
        f.style.animationDelay = -Math.random() * 15 + "s";
        f.style.setProperty("--drift", (Math.random() * 80 - 40) + "px");
        f.style.opacity = 0.4 + Math.random() * 0.5;
        snow.appendChild(f);
      }
    })();

    // ---------- helpers ----------
    function show(id) {
      document.querySelectorAll(".screen").forEach((s) => s.classList.toggle("active", s.id === id));
      window.scrollTo({ top: 0, behavior: "smooth" });
    }
    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    // ---------- intro ----------
    byId("title").textContent = QUIZ.title;
    byId("subtitle").textContent = QUIZ.subtitle.replace("{count}", QUIZ.questions.length);
    byId("heroCookies").innerHTML = QUIZ.personalities.map((p) => drawGift(p.icon, p.color)).join("");
    byId("ovenCookie").innerHTML = drawGift("present", "#c8283a");

    byId("startForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const name = byId("name").value.trim();
      if (!name) {
        byId("nameError").textContent = "Pop your name in so we can find you later!";
        byId("name").focus();
        return;
      }
      byId("nameError").textContent = "";
      playerName = name;
      current = 0;
      picks = new Array(QUIZ.questions.length).fill(null);
      shuffled = QUIZ.questions.map((q) => shuffle(q.answers.map((_, i) => i)));
      renderQuestion();
      show("quiz");
    });

    // ---------- questions ----------
    function renderQuestion() {
      const q = QUIZ.questions[current];
      const total = QUIZ.questions.length;
      byId("progressText").textContent = `Question ${current + 1} of ${total}`;
      byId("progressBar").style.width = (current / total) * 100 + "%";
      byId("backBtn").style.visibility = "visible";
      byId("questionText").textContent = q.q;

      const box = byId("answers");
      box.innerHTML = "";
      shuffled[current].forEach((ansIndex) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "answer" + (picks[current] === ansIndex ? " chosen" : "");
        btn.textContent = q.answers[ansIndex].text;
        btn.addEventListener("click", () => choose(ansIndex, btn));
        box.appendChild(btn);
      });
    }

    let locked = false;
    function choose(ansIndex, btn) {
      if (locked) return;
      locked = true;
      picks[current] = ansIndex;
      document.querySelectorAll(".answer").forEach((b) => b.classList.remove("chosen"));
      btn.classList.add("chosen");
      setTimeout(() => {
        locked = false;
        if (current < QUIZ.questions.length - 1) {
          current++;
          renderQuestion();
        } else {
          byId("progressBar").style.width = "100%";
          finish();
        }
      }, 260);
    }

    byId("backBtn").addEventListener("click", () => {
      if (current === 0) return show("intro");
      current--;
      renderQuestion();
    });

    // ---------- scoring + saving ----------
    function computeScores() {
      const scores = Object.fromEntries(QUIZ.personalities.map((p) => [p.id, 0]));
      picks.forEach((ansIndex, qi) => {
        const a = QUIZ.questions[qi].answers[ansIndex];
        if (!a) return;
        const pts = a.points || (a.p ? { [a.p]: 1 } : {});
        for (const [pid, n] of Object.entries(pts)) if (pid in scores) scores[pid] += Number(n) || 0;
      });
      return scores;
    }

    function localPick(scores) {
      const best = Math.max(...Object.values(scores));
      const tied = Object.keys(scores).filter((k) => scores[k] === best);
      return tied[Math.floor(Math.random() * tied.length)];
    }

    async function finish() {
      show("loading");
      const scores = computeScores();
      const started = Date.now();
      let personality, saved = true;

      try {
        const res = await fetch("/api/submit", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name: playerName, scores }),
        });
        const data = await res.json();
        if (!res.ok || !personalityById[data.personality]) throw new Error(data.error || "Save failed");
        personality = data.personality;
      } catch (err) {
        console.warn(err);
        personality = localPick(scores);
        saved = false;
      }

      // let the "baking" animation play for a moment
      const wait = Math.max(0, 1600 - (Date.now() - started));
      setTimeout(() => {
        const result = { name: playerName, personality, saved };
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(result)); } catch {}
        renderResult(result);
      }, wait);
    }

    // ---------- result ----------
    function renderResult({ name, personality, saved }) {
      const p = personalityById[personality];
      if (!p) return show("intro");
      document.documentElement.style.setProperty("--accent", p.color);
      byId("resultHello").textContent = `${name}, you are…`;
      byId("resultCookie").innerHTML = drawGift(p.icon, p.color);
      byId("resultName").textContent = p.name;
      byId("resultTitle").textContent = p.title || "";
      byId("resultTagline").textContent = p.reveal || "";
      byId("resultGift").textContent = p.gift || "";
      byId("resultVibe").textContent = p.vibe || "";
      byId("resultTeam").textContent = p.team;
      const traits = byId("resultTraits");
      traits.innerHTML = "";
      p.traits.forEach((t) => {
        const s = document.createElement("span");
        s.className = "trait";
        s.textContent = t;
        traits.appendChild(s);
      });
      const note = byId("saveNote");
      note.hidden = saved !== false;
      note.textContent = "We couldn't save your result online. Please show this screen to an organiser!";
      show("result");
    }

    byId("retakeBtn").addEventListener("click", () => {
      try { localStorage.removeItem(STORAGE_KEY); } catch {}
      document.documentElement.style.removeProperty("--accent");
      byId("name").value = "";
      show("intro");
    });

    // Returning visitor: show their earlier result instead of making a duplicate entry.
    try {
      const prev = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if (prev && personalityById[prev.personality]) renderResult(prev);
    } catch {}
  </script>
</body>
</html>
